server:
  port: 8085

spring:
  application:
    name: incident-service
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME:safeguard}:${MONGO_PASSWORD:localdev123}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/safeguard_incidents?authSource=admin
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:safeguard_dev}
    username: ${POSTGRES_USER:safeguard}
    password: ${POSTGRES_PASSWORD:localdev123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
