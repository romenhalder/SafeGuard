server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native,local
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
      fail-fast: false
    inetutils:
      ignored-interfaces: eth.*
    vault:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
