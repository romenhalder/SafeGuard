# Shared platform config served by config-server (native profile).
# Mirrors each service's own application.yml env-var defaults so local
# values stay consistent whether or not the config server is reachable.
spring:
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:safeguard_dev}?sslmode=require}
    username: ${POSTGRES_USER:safeguard}
    password: ${POSTGRES_PASSWORD:localdev123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/safeguard_incidents}
  cloud:
    vault:
      enabled: false
    config:
      fail-fast: false

app:
  jwt:
    secret: ${JWT_SECRET:ZGVmYXVsdFNlY3JldEtleVRoYXRTaG91bGRCZVJlcGxhY2VkSW5Qcm9kdWN0aW9u}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
