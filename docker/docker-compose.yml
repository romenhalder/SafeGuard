# ============================================
# SAFEGUARD - Docker Compose (Full Local Dev)
# ============================================
# Usage:
#   make up              - Start everything
#   make up-infra        - Start only DBs + Redis + Vault
#   make up-services     - Start only microservices
#   make down            - Stop everything
#   make logs            - View all logs
# ============================================

version: "3.9"

x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: local
  VAULT_ADDR: http://vault:8200
  VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
  VAULT_ENV: dev

services:

  # ═══════════════════════════════════════════
  #  INFRASTRUCTURE SERVICES
  # ═══════════════════════════════════════════

  postgres:
    image: postgis/postgis:15-3.4
    container_name: safeguard-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safeguard_dev}
      POSTGRES_USER: ${POSTGRES_USER:-safeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safeguard} -d ${POSTGRES_DB:-safeguard_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - safeguard-net

  redis:
    image: redis:7-alpine
    container_name: safeguard-redis
    hostname: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-localdev123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localdev123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safeguard-net

  mongodb:
    image: mongo:7
    container_name: safeguard-mongodb
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-safeguard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-localdev123}
      MONGO_INITDB_DATABASE: safeguard_incidents
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-db/mongo-init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - safeguard-net

  vault:
    image: hashicorp/vault:1.15
    container_name: safeguard-vault
    hostname: vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    command: server -dev -log-level=info
    volumes:
      - vault_data:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - safeguard-net

  # ═══════════════════════════════════════════
  #  SERVICE DISCOVERY & CONFIG
  # ═══════════════════════════════════════════

  eureka-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: service-registry
    container_name: safeguard-eureka
    hostname: eureka-server
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:8761"
    environment:
      <<: *common-env
      EUREKA_CLIENT_FETCHREGISTRY: "false"
      EUREKA_CLIENT_REGISTERWITHEUREKA: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - safeguard-net

  config-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: config-server
    container_name: safeguard-config
    hostname: config-server
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    environment:
      <<: *common-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - safeguard-net

  # ═══════════════════════════════════════════
  #  MICROSERVICES
  # ═══════════════════════════════════════════

  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: safeguard-gateway
    hostname: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *common-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
    depends_on:
      eureka-server:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - safeguard-net

  auth-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: safeguard-auth
    hostname: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8080"
    environment:
      <<: *common-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - safeguard-net

  user-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: safeguard-user
    hostname: user-service
    ports:
      - "${USER_SERVICE_PORT:-8082}:8080"
    environment:
      <<: *common-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      POSTGRES_HOST: postgres
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - safeguard-net

  alert-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: alert-service
    container_name: safeguard-alert
    hostname: alert-service
    ports:
      - "${ALERT_SERVICE_PORT:-8083}:8080"
    environment:
      <<: *common-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MONGO_HOST: mongodb
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - safeguard-net

  location-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: location-service
    container_name: safeguard-location
    hostname: location-service
    ports:
      - "${LOCATION_SERVICE_PORT:-8084}:8080"
    environment:
      <<: *common-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - safeguard-net

  incident-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: incident-service
    container_name: safeguard-incident
    hostname: incident-service
    ports:
      - "${INCIDENT_SERVICE_PORT:-8085}:8080"
    environment:
      <<: *common-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      POSTGRES_HOST: postgres
      MONGO_HOST: mongodb
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - safeguard-net

  admin-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: admin-service
    container_name: safeguard-admin
    hostname: admin-service
    ports:
      - "${ADMIN_SERVICE_PORT:-8086}:8080"
    environment:
      <<: *common-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - safeguard-net

  notification-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: notification-service
    container_name: safeguard-notification
    hostname: notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8087}:8080"
    environment:
      <<: *common-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      REDIS_HOST: redis
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - safeguard-net

  analytics-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: analytics-service
    container_name: safeguard-analytics
    hostname: analytics-service
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8088}:8080"
    environment:
      <<: *common-env
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      POSTGRES_HOST: postgres
      MONGO_HOST: mongodb
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - safeguard-net

  # ═══════════════════════════════════════════
  #  MONITORING (Optional - make monitoring-up)
  # ═══════════════════════════════════════════

  prometheus:
    image: prom/prometheus:latest
    container_name: safeguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - safeguard-net
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: safeguard-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: safeguard
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - safeguard-net
    profiles:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: safeguard-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - safeguard-net
    profiles:
      - monitoring

  loki:
    image: grafana/loki:2.9.0
    container_name: safeguard-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - safeguard-net
    profiles:
      - monitoring

# ═══════════════════════════════════════════
#  NETWORKS & VOLUMES
# ═══════════════════════════════════════════

networks:
  safeguard-net:
    driver: bridge
    name: safeguard-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongo_data:
    driver: local
  vault_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
