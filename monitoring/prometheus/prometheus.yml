# ============================================
# SAFEGUARD - Prometheus Configuration
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ── Prometheus self-monitoring ──
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── SafeGuard Services (via Kubernetes SD) ──
  - job_name: "safeguard-services"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - safeguard-dev
            - safeguard-staging
            - safeguard-production
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2

  # ── Node Exporter (system metrics) ──
  - job_name: "node-exporter"
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.*):(.*)"
        replacement: "${1}:9100"
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # ── Redis Metrics ──
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ── PostgreSQL Metrics ──
  - job_name: "postgresql"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Vault Metrics ──
  - job_name: "vault"
    static_configs:
      - targets: ["vault:8200"]
    metrics_path: "/v1/sys/metrics"
    params:
      format: ["prometheus"]

  # ── MongoDB Metrics ──
  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
