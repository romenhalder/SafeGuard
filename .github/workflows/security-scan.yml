# ============================================
# SAFEGUARD - Security Scan Pipeline
# Triggered on: PR, weekly schedule
# ============================================
name: "Security - Scan & Audit"

on:
  pull_request:
    branches: [develop, staging, main]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday 6 AM UTC

jobs:

  # ═══════════════════════════════════════════
  #  SECRET DETECTION (Prevent leaks)
  # ═══════════════════════════════════════════
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run detect-secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ═══════════════════════════════════════════
  #  DEPENDENCY VULNERABILITY SCAN
  # ═══════════════════════════════════════════
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Install shared library
        run: mvn install -DskipTests --no-transfer-progress -q -pl libs/safeguard-common -am -B

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -B \
            -DfailBuildOnCVSS=7 \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DnvdApiDelay=2000 \
            -DsuppressionFiles=.github/dependency-check-suppressions.xml

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report
          path: target/dependency-check-report.html
          retention-days: 30

  # ═══════════════════════════════════════════
  #  STATIC CODE ANALYSIS (GitHub CodeQL)
  # ═══════════════════════════════════════════
  code-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build
        run: mvn clean install -DskipTests --no-transfer-progress -B

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
