# ============================================
# SAFEGUARD - Security Scan Pipeline
# Triggered on: PR, weekly schedule
# ============================================
name: "Security - Scan & Audit"

on:
  pull_request:
    branches: [develop, staging, main]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday 6 AM UTC

jobs:

  # ═══════════════════════════════════════════
  #  SECRET DETECTION (Prevent leaks)
  # ═══════════════════════════════════════════
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run detect-secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ═══════════════════════════════════════════
  #  DEPENDENCY VULNERABILITY SCAN
  # ═══════════════════════════════════════════
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -B \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFiles=.github/dependency-check-suppressions.xml

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report
          path: target/dependency-check-report.html
          retention-days: 30

  # ═══════════════════════════════════════════
  #  DOCKER IMAGE SECURITY SCAN
  # ═══════════════════════════════════════════
  image-scan:
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - alert-service
          - location-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          mvn clean package -DskipTests -pl services/${{ matrix.service }} -am -B
          docker build \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            -t safeguard/${{ matrix.service }}:scan \
            -f docker/Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "safeguard/${{ matrix.service }}:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ═══════════════════════════════════════════
  #  STATIC CODE ANALYSIS
  # ═══════════════════════════════════════════
  code-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=safeguard \
            -Dsonar.host.url=${{ secrets.SONAR_URL }} \
            -Dsonar.login=$SONAR_TOKEN \
            -B
